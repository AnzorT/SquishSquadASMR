<!-- The chest smash (REDESIGN_V6 step 6): the design's "Chest Smash v2" — its own chest engine
     (chest-models.js + chest-<group>.js: dents, cracks, holes, torn parts, burst, loot) and sounds
     (chest-sfx.js), copied unchanged by tools/chest/build.mjs — with the page's overlay rebuilt here
     without the design tool's framework. The server has already rolled the chest (squad groupChest
     and friends): this plays that result, upgrade included, and says when COLLECT is tapped.
     src/components/ChestSmash.js drives it: rigHost-style `chestHost.start({...})`. -->
<style>
  @font-face { font-family: 'Fredoka'; font-weight: 700; src: url('fonts/Fredoka_700Bold.ttf'); }
  @font-face { font-family: 'Nunito'; font-weight: 700; src: url('fonts/Nunito_700Bold.ttf'); }

  @keyframes c2Slam { 0%{ transform:scale(2.6) rotate(-8deg); opacity:0;} 40%{ transform:scale(0.92) rotate(2deg); opacity:1;} 65%{ transform:scale(1.06) rotate(-1deg);} 100%{ transform:scale(1) rotate(0deg); opacity:1;} }
  @keyframes c2Rise { from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
  @keyframes c2Hue { from{ filter:hue-rotate(0deg);} to{ filter:hue-rotate(360deg);} }
  @keyframes c2Fade { from{ opacity:0;} to{ opacity:1;} }
  @keyframes c2Rays { from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }
  @keyframes c2Card { 0%{ transform:scale(0.2) rotate(-14deg); opacity:0;} 55%{ transform:scale(1.08) rotate(3deg); opacity:1;} 100%{ transform:scale(1) rotate(0deg); opacity:1;} }

  #cpFill.full { background: linear-gradient(180deg,#d8ffc2 0%,#6fe07a 55%,#26a94e 100%); }

  #cpNote { font-weight: 900; font-size: 13px; color: #ffe27a; text-align: center; }
  #collect { position: relative; overflow: hidden; width: 230px; height: 64px; border: 3px solid #fff; border-radius: 24px; background: linear-gradient(180deg,#d8ffc2 0%,#6fe07a 55%,#26a94e 100%); box-shadow: 0 0 0 2.5px #17652f, 0 6px 0 2.5px #17652f, 0 12px 20px rgba(20,80,40,0.35); font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 1px; color: #fff; text-shadow: 0 2.5px 0 #17652f, 2px 0 0 #17652f, -2px 0 0 #17652f; animation: c2Rise 0.4s 0.7s ease-out both; }
  #collect:active { transform: translateY(4px); }
  /* ---- landscape (REDESIGN_V7: the whole app is sideways now) ---- */
  @media (orientation: landscape) {
    #top { padding-top: calc(var(--inset-top, 0px) + 12px); gap: 5px; }
    #name { font-size: 24px; }
    #bottom { padding-bottom: calc(var(--inset-bottom, 0px) + 14px); }
    #bannerWrap { top: 24%; }
    /* the reveal in two columns: the card on the left, what came with it and COLLECT on the right */
    #reveal { display: none; flex-direction: row; flex-wrap: nowrap; gap: 0 36px; padding: 16px 36px; }
    #reveal.on { display: grid; grid-template-columns: auto 300px; grid-template-rows: auto auto auto auto auto auto; align-content: center; justify-content: center; column-gap: 44px; row-gap: 10px; }
    #reveal.on > #rays { grid-column: 1; grid-row: 1 / span 6; }
    #reveal.on > #card { grid-column: 1; grid-row: 1 / span 6; align-self: center; width: 232px; padding: 12px 12px 14px; }
    #reveal.on #art { width: 168px; height: 168px; }
    #reveal.on #rvName { font-size: 26px; }
    #reveal.on > #rvUp, #reveal.on > #rvNew, #reveal.on > #rvCopies, #reveal.on > #loot, #reveal.on > #rvPity, #reveal.on > #collect { grid-column: 2; justify-self: center; }
    #reveal.on > #rvUp { grid-row: 1; }
    #reveal.on > #rvNew { grid-row: 2; }
    #reveal.on > #rvCopies { grid-row: 3; width: 280px; }
    #reveal.on > #loot { grid-row: 4; }
    #reveal.on > #rvPity { grid-row: 5; text-align: center; }
    #reveal.on > #collect { grid-row: 6; margin-top: 6px; }
  }
</style>
<script>
// Performance (2026-11-14): the chest engine draws its whole canvas every frame at up to 2x the CSS size, so its cost
// grows with the resolution. Here it's capped at 1.5x, and drops to 1x (with half the particles) when the phone
// can't keep up (fps watched while the chest is up, watchFps below), or from the start on a phone with 2 GB of memory
// or 2 cores or fewer.
// Each chest opening loads this page afresh, so on a slow phone every smash began at full quality and stuttered until
// the watcher stepped down. It's remembered now (localStorage, shared with the menu's page): a smash that needed lite,
// or the menu having had to slow its creatures (webgame/app/perf.js 'sq.perfStep'), starts the next chests in lite.
// Forgotten after 14 days, so a phone is tried at full quality again now and then.
(function () {
  var DAYS14 = 14 * 864e5, now = Date.now(), seen = false;
  try {
    seen = now - (+localStorage.getItem('sq.chestLite') || 0) < DAYS14;
    var m = JSON.parse(localStorage.getItem('sq.perfStep') || 'null');
    if (m && m.step >= 2 && now - m.t < DAYS14) seen = true;
  } catch (e) { /* no storage */ }
  var weak = (navigator.deviceMemory && navigator.deviceMemory <= 2) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2);
  var lite = !!(weak || seen);
  var real = window.devicePixelRatio || 1, cap = Math.min(real, lite ? 1 : 1.5);
  try { Object.defineProperty(window, 'devicePixelRatio', { configurable: true, get: function () { return cap; } }); } catch (e) { /* old WebView */ }
  window.chestPerf = {
    lite: lite, remembered: seen, real: real, cap: function () { return cap; }, setCap: function (c) { cap = c; },
    remember: function () { try { localStorage.setItem('sq.chestLite', String(Date.now())); } catch (e) { /* no storage */ } },
  };
})();
</script>

<script>
(function () {
  // Chest Smash v2's tables
  const TN = [
    { n: 'Common', c: '#8d7b6a', ink: '#5a4636' },
    { n: 'Rare', c: '#2f8cff', ink: '#0e4aa8' },
    { n: 'Epic', c: '#a24bf0', ink: '#5a1a9a' },
    { n: 'Legendary', c: '#f08c00', ink: '#9a4a00' },
    { n: 'Rainbow', c: '#e0459f', ink: '#8a1a6a' },
  ];
  const TI = { common: 0, rare: 1, epic: 2, legendary: 3, set: 4, rainbow: 4 };
  const GROUPS = {
    snack: { n: 'Snack Shack', bg: 'repeating-conic-gradient(#ffb59a 0 25%, #fff0e2 0 50%) 0 0/56px 56px', floor: 'linear-gradient(180deg,#e7b88a 0%,#d39a68 40%,#b97c4c 100%)' },
    fruit: { n: 'Fruit Patch', bg: 'repeating-conic-gradient(#c4eba4 0 25%, #f4ffe6 0 50%) 0 0/56px 56px', floor: 'linear-gradient(180deg,#a8dc78 0%,#7cc458 40%,#4f9a3c 100%)' },
    ocean: { n: 'Ocean Pals', bg: 'repeating-conic-gradient(#a8e2ff 0 25%, #eefaff 0 50%) 0 0/56px 56px', floor: 'linear-gradient(180deg,#f8e2ae 0%,#ecc884 40%,#cfa25e 100%)' },
    pet: { n: 'Pet Shop', bg: 'repeating-conic-gradient(#e6caff 0 25%, #fbf2ff 0 50%) 0 0/56px 56px', floor: 'linear-gradient(180deg,#deae7e 0%,#c08a5c 40%,#98663c 100%)' },
    forest: { n: 'Forest Friends', bg: 'repeating-conic-gradient(#b8e0a0 0 25%, #f2fbe8 0 50%) 0 0/56px 56px', floor: 'linear-gradient(180deg,#8ac86a 0%,#5fa848 40%,#3e7a30 100%)' },
    sky: { n: 'Sky & Stars', bg: 'repeating-conic-gradient(#b8c8ff 0 25%, #eef2ff 0 50%) 0 0/56px 56px', floor: 'linear-gradient(180deg,#d8e4ff 0%,#b0c4f4 40%,#8a9ee0 100%)' },
    dream: { n: 'Dreamland', bg: 'repeating-conic-gradient(#e2d2ff 0 25%, #faf6ff 0 50%) 0 0/56px 56px', floor: 'linear-gradient(180deg,#d8c8f4 0%,#bca8e8 40%,#9a84d0 100%)' },
    bakery: { n: 'Sweet Bakery', bg: 'repeating-conic-gradient(#bff0e2 0 25%, #fff8f0 0 50%) 0 0/56px 56px', floor: 'linear-gradient(180deg,#f2d4b4 0%,#e0b48a 40%,#c08a5c 100%)' },
    heroes: { n: 'Masked Heroes', bg: 'repeating-conic-gradient(#ffc2c2 0 25%, #fff4ee 0 50%) 0 0/56px 56px', floor: 'linear-gradient(180deg,#a8b4d0 0%,#7e8cb0 40%,#58668e 100%)' },
    elemental: { n: 'Elemental Heroes', bg: 'repeating-conic-gradient(#c8ccf0 0 25%, #f2f2fc 0 50%) 0 0/56px 56px', floor: 'linear-gradient(180deg,#b8b2c0 0%,#8e8898 40%,#625c6e 100%)' },
    spooky: { n: 'Spooky Squish', bg: 'repeating-conic-gradient(#d8c2f4 0 25%, #f6f0fc 0 50%) 0 0/56px 56px', floor: 'linear-gradient(180deg,#8a6aa8 0%,#6a4a8a 40%,#4a2e6a 100%)' },
  };
  const RCARD = ['#e6f5ff', '#e2fbef', '#f1e6ff', '#fff0dc', '#ffe9f6'], RLIP = ['#5a9ad2', '#38a878', '#8a5ae0', '#d08a20', '#d3179a'];
  const fmt = (n) => Number(n || 0).toLocaleString('en-US');
  const $ = (id) => document.getElementById(id);
  const post = (m) => { const s = JSON.stringify(m); if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(s); else (window.__chestOut = window.__chestOut || []).push(m); };

  // (no POWER bar or SUPER taps: the user, 2026-10-25)
  let S = null, run = null, st = null, bk = 0, bannerT = 0, revealT = 0;
  // st: { gk, start, final, tier, hp, max, name, phase, first, reward, held }
  // (phase 'wait': the scene is up and the server's answer on its way; `held`: a first tap meanwhile)

  function paint() {
    if (!st) return;
    const T = TN[st.tier] || TN[2], G = GROUPS[st.gk] || GROUPS.ocean;
    // the vault room, a warm light where the chest stands; the banners in the group's colour
    $('bg').style.background = 'radial-gradient(circle at 50% 66%, rgba(255,226,160,0.3) 0, rgba(255,226,160,0) 30%), url(vault-room.jpg) center bottom / cover no-repeat, #22160e';
    $('vault').style.setProperty('--ban', (G.bg.match(/#[0-9a-f]{6}/i) || ['#e6caff'])[0]);
    $('floor').style.background = G.floor;
    $('tierLabel').textContent = G.n.toUpperCase() + ' · ' + T.n.toUpperCase();
    $('tierLabel').style.color = T.c;
    $('name').textContent = st.name;
    const pips = $('pips'), max = Math.max(1, st.max);
    if (pips.children.length !== max) { pips.innerHTML = ''; for (let i = 0; i < max; i++) { const d = document.createElement('div'); d.className = 'pip'; pips.appendChild(d); } }
    [...pips.children].forEach((d, i) => { const on = i < st.hp; d.style.background = on ? '#7ee87a' : 'rgba(255,255,255,0.25)'; d.style.boxShadow = 'inset 0 -3px 0 ' + (on ? '#3aa83a' : 'rgba(0,0,0,0.15)') + ', inset 0 2px 0 rgba(255,255,255,0.55)'; });
    $('hp').textContent = st.hp + ' HP';
    const idle = st.first && st.start <= 1 ? 'Tap to smash. The first tap might upgrade it!' : 'Keep tapping!';
    const HINT = { idle, wait: idle, up: 'Upgrading… tap to skip', ko: 'Bursting open…', open: 'Opened!' };
    const hint = HINT[st.phase] || '';
    if ($('hint').textContent !== hint) { const h = $('hint'); h.textContent = hint; h.style.animation = 'none'; void h.offsetWidth; h.style.animation = ''; }
    $('bottom').style.opacity = st.phase === 'ko' || st.phase === 'open' ? 0.4 : 1;
  }

  function banner(text, tier) {
    clearTimeout(bannerT);
    const ink = TN[tier].ink, glow = TN[tier].c, w = $('bannerWrap');
    w.innerHTML = '';
    const b = document.createElement('div');
    b.className = 'banner'; b.textContent = text; b.dataset.k = ++bk;
    b.style.textShadow = ['3px 0 0', '-3px 0 0', '0 3px 0', '0 -3px 0', '2.4px 2.4px 0', '-2.4px -2.4px 0', '2.4px -2.4px 0', '-2.4px 2.4px 0', '0 7px 0', '0 0 28px'].map((s) => s + ' ' + ink).join(', ') + ', 0 0 54px ' + glow;
    b.style.animation = tier === 4 ? 'c2Slam 0.6s cubic-bezier(0.2,0.9,0.3,1.2) both, c2Hue 2s linear infinite' : 'c2Slam 0.6s cubic-bezier(0.2,0.9,0.3,1.2) both';
    w.appendChild(b);
    bannerT = setTimeout(() => (w.innerHTML = ''), 1500);
  }

  function showReveal() {
    const rw = st.reward || {}, T = TN[st.tier] || TN[2], G = GROUPS[st.gk] || GROUPS.ocean;
    $('rvUp').style.display = st.tier > st.start ? '' : 'none';
    $('rvUp').textContent = 'UPGRADED TO ' + T.n.toUpperCase() + '!';
    $('rvUp').style.color = T.c;
    // a copy toward unlocking it (+1 COPY and the bar), the copy that unlocks
    // it (UNLOCKED!), or one that came whole (NEW SQUISHY!)
    const copy = !rw.isNew && rw.copies > 0;
    const counted = rw.need > 1 && (copy || rw.isNew);
    $('rvNew').style.display = rw.isNew || copy ? '' : 'none';
    $('rvNew').textContent = copy ? '+1 COPY' : counted ? 'UNLOCKED!' : 'NEW SQUISHY!';
    $('rvNew').className = copy ? 'copy' : '';
    $('rvCopies').style.display = counted ? 'flex' : 'none';
    if (counted) {
      const fill = $('cpFill'), n = Math.min(rw.copies, rw.need);
      fill.className = n >= rw.need ? 'full' : '';
      fill.style.transition = 'none';
      fill.style.width = (((n - 1) / rw.need) * 100).toFixed(1) + '%';
      void fill.offsetWidth;
      fill.style.transition = '';
      setTimeout(() => (fill.style.width = ((n / rw.need) * 100).toFixed(1) + '%'), 900);
      $('cpText').textContent = n + ' / ' + rw.need;
      const left = rw.need - n;
      $('cpNote').textContent = left > 0 ? 'Find ' + left + ' more to unlock ' + rw.name + '!' : rw.name + ' joins your squad!';
    }
    const has = !!rw.name;
    $('card').style.background = has ? (RCARD[rw.rar] || '#ffffff') : '#ffffff';
    $('card').style.boxShadow = '0 0 0 3px ' + (has ? RLIP[rw.rar] || '#8e1580' : '#8e1580') + ', 0 8px 0 3px ' + (has ? RLIP[rw.rar] || '#8e1580' : '#8e1580') + ', 0 0 50px 10px rgba(255,220,120,0.45)';
    $('rvImg').style.display = rw.img ? '' : 'none';
    if (rw.img) $('rvImg').src = rw.img;
    $('rvRar').textContent = has ? rw.rarLabel : G.n.toUpperCase();
    $('rvRar').style.background = has ? rw.rarBg : '#ffffff';
    $('rvRar').style.color = has ? rw.rarInk : '#5b3418';
    $('rvName').textContent = has ? rw.name : 'Loot!';
    $('rvConcept').textContent = rw.concept || '';
    // coins only for a duplicate (or a finished set): no chip at all otherwise
    const coins = (rw.coins || 0) + (rw.dupeCoins || 0) + (rw.setBonus || 0);
    $('loot').style.display = coins ? 'flex' : 'none';
    $('rvCoins').textContent = '+' + fmt(coins);
    $('rvDupe').style.display = !rw.isNew && rw.dupeCoins ? '' : 'none';
    $('rvDupe').textContent = 'Duplicate';
    $('rvPity').style.display = rw.luck ? '' : 'none';
    // restart the card's entrance animations
    // (a class, not an inline display: the landscape layout is a grid)
    $('reveal').classList.remove('on'); $('reveal').style.display = 'none'; void $('reveal').offsetWidth; $('reveal').style.display = ''; $('reveal').classList.add('on');
    // where COLLECT ends up (after its entrance), for the app's tutorial
    setTimeout(() => { const r = $('collect').getBoundingClientRect(); post({ type: 'reveal', collect: { x: r.left, y: r.top, w: r.width, h: r.height } }); }, 1150);
  }

  function ev(e) {
    if (!st) return;
    if (e.type === 'loaded') Object.assign(st, { tier: e.tier, hp: e.hp, max: e.max, name: e.name });
    else if (e.type === 'hp') Object.assign(st, { hp: e.hp, max: e.max });
    else if (e.type === 'step') { Object.assign(st, { tier: e.tier, hp: e.hp, max: e.max, name: e.name }); banner(TN[e.tier].n.toUpperCase() + '!', e.tier); post({ type: 'step', tier: e.tier }); }
    else if (e.type === 'upgradeDone') st.phase = 'idle';
    else if (e.type === 'koStart') st.phase = 'ko';
    else if (e.type === 'ko') {
      st.phase = 'open'; banner('OPENED!', e.tier); post({ type: 'opened' });
      clearTimeout(revealT); revealT = setTimeout(showReveal, 1700);
    }
    paint();
  }

  function tap(e) {
    if (!S || !st) return;
    if (st.phase === 'wait') { if (!st.held) st.held = { clientX: e.clientX, clientY: e.clientY }; return; }
    if (st.phase === 'up') { S.skipUp(); return; }
    if (st.phase !== 'idle') return;
    if (st.first) {
      st.first = false;
      // the server's upgrade (rolled at the purchase), played on the first tap
      if (st.final > st.tier) { st.phase = 'up'; paint(); S.upgrade(st.final); post({ type: 'upgrade', to: st.final }); return; }
    }
    S.hitAt(e.clientX, e.clientY, 1);
    paint();
    post({ type: 'hit' });
  }
  $('cv').addEventListener('pointerdown', tap);
  $('collect').addEventListener('click', () => post({ type: 'collect' }));

  window.chestHost = {
    // { group, size, final, reward: { name, rar, rarLabel, rarBg, rarInk, concept, img, isNew, copies, need, coins, dupeCoins, setBonus, luck }, sound, insetTop, insetBottom }
    // (img: the creature's front art, ../rig/export/tripo/<key>/<key>-front.svg)
    // `wait`: no final/reward yet, fill() brings them. Says 'shown' once the scene is painted.
    start(o) {
      clearTimeout(revealT); clearTimeout(bannerT);
      $('bannerWrap').innerHTML = ''; $('reveal').style.display = 'none'; $('reveal').classList.remove('on');
      document.documentElement.style.setProperty('--inset-top', (o.insetTop || 0) + 'px');
      document.documentElement.style.setProperty('--inset-bottom', (o.insetBottom || 0) + 'px');
      const gk = GROUPS[o.group] ? o.group : 'ocean', start = TI[o.size] ?? 0, final = Math.max(start, TI[o.final] ?? start);
      st = { gk, start, final, tier: start, hp: 0, max: 1, name: '', phase: o.wait ? 'wait' : 'idle', first: true, reward: o.reward || null, held: null };
      const CM = window.ChestModels;
      if (!S) {
        // lite: every other particle (bursts and dust are the costliest part of a smash)
        const P0 = CM.Stage.prototype.P;
        if (!CM.Stage.prototype._sqP) { CM.Stage.prototype._sqP = 1; CM.Stage.prototype.P = function (q) { if (chestPerf.lite && (this._pk = (this._pk || 0) + 1) % 2) return; return P0.call(this, q); }; cacheLayer(CM.Stage.prototype); }
        S = new CM.Stage($('cv'), { group: gk, ground: 0.73, top: 178 + (o.insetTop || 0), onEvent: ev }); S.load(gk, start, true);
      }
      else S.reset(gk, start);
      watchFps();
      S.sound = o.sound !== false;
      paint();
      requestAnimationFrame(() => requestAnimationFrame(() => post({ type: 'shown' })));
    },
    // the server's answer for the chest start({ wait }) put up: { final, reward }
    fill(o) {
      if (!st) return;
      st.final = Math.max(st.start, TI[o.final] ?? st.start);
      st.reward = o.reward || null;
      if (st.phase !== 'wait') return;
      st.phase = 'idle';
      const h = st.held;
      st.held = null;
      if (h) tap(h); else paint();
    },
    sound(on) { if (S) S.sound = !!on; },
    // The tester's FPS counter (src/components/FpsCounter.js): while on, this page's own frames go to the app every
    // half second: { type: 'fps', fps, low: the slowest frame as fps, lite }. Off unless the app asks.
    meter(on) {
      if (on && !meterId) { mt = 0; meterId = requestAnimationFrame(meter); }
      else if (!on && meterId) { cancelAnimationFrame(meterId); meterId = 0; }
    },
  };
  let mt = 0, mlast = 0, mn = 0, mworst = 0, meterId = 0;
  function meter(now) {
    meterId = requestAnimationFrame(meter);
    if (!mt || document.hidden) { mt = mlast = now; mn = 0; mworst = 0; return; }
    const dt = now - mlast; mlast = now; mn++;
    if (dt > mworst) mworst = dt;
    if (now - mt < 500) return;
    post({ type: 'fps', fps: Math.round((mn * 1000) / (now - mt)), low: Math.round(1000 / Math.max(mworst, 1)), lite: chestPerf.lite });
    mt = now; mn = 0; mworst = 0;
  }

  // While a chest is up: a second under ~48 fps twice in a row, or one under ~35 -> lite (1x canvas, half the
  // particles), kept for the rest of this chest. (It looked at the first ~1.5 s only: the idle chest often passed and
  // the smash, the costliest part, then ran at full quality.) A gap of over a second is the page paused, not slow.
  // Remembered for the next chests (chestPerf.remember) unless it was the very first second measured: that one can be
  // slow from the page loading its art, not from the phone.
  let watching = false;
  function watchFps() {
    if (chestPerf.lite || watching) return;
    watching = true;
    let t0 = 0, last = 0, n = 0, slow = 0, secs = 0;
    const f = (now) => {
      if (chestPerf.lite || !S) { watching = false; return; }
      requestAnimationFrame(f);
      if (document.hidden || now - last > 1000) t0 = 0;
      last = now;
      if (!t0) { t0 = now; n = 0; return; }
      n++;
      if (now - t0 < 1000) return;
      const fps = (n * 1000) / (now - t0);
      t0 = now; n = 0; secs++;
      slow = fps < 48 ? slow + 1 : 0;
      if (fps < 35 || slow >= 2) {
        chestPerf.lite = true; chestPerf.setCap(1); S.resize(); watching = false;
        if (secs >= 2) chestPerf.remember();
      }
    };
    setTimeout(() => requestAnimationFrame(f), 400);
  }

  // The chest's picture (Stage.renderLayer: every part, dent, crack and hole drawn as vectors into an off-screen
  // canvas) was drawn again every frame, though most frames only move it (the wobble, the hop and the shake are
  // transforms in draw()). It's drawn again only when something it shows has changed: a hit (hp), the damage, the
  // dents, cracks, holes and torn parts, a hinged part's swing, the hit flash, the burst, a charge-up (every frame),
  // a spinning gradient (every frame) or the scale. resize() clears the canvas, so it forgets the picture.
  // In lite, the soft changes (a swing, the flash fading, the burst, a charge-up, a spin) update the picture every other
  // frame; the hard ones (a hit, the damage, the scale) at once. The chest still moves every frame. (2026-11-14)
  function cacheLayer(proto) {
    const RL0 = proto.renderLayer, RS0 = proto.resize;
    const spinning = (f) => !!(f && typeof f === 'object' && f.k && f.spin);
    const spins = (m) => {
      if (m._sqSpin == null) m._sqSpin = m.parts.some((p) => p.sh.concat(p.scar || []).some((s) => spinning(s.f) || spinning(s.s)));
      return m._sqSpin;
    };
    proto.renderLayer = function () {
      const c = this.chest;
      if (!c) return RL0.call(this);
      const hard = this.k + '|' + c.seed + '|' + this.hp + '|' + c.d + '|' + c.dents.length + '|' + c.cracks.length + '|' + c.holes.length + '|' + Object.keys(c.torn).length;
      let soft = this.flash + '|' + (this.burst > 0.55 ? this.burst : 0);
      for (const id in c.ang) soft += '|' + Math.round(c.ang[id] * 3000);
      if (this.charge || spins(c.m)) soft += '|' + this.time;
      if (hard === this._sqHard && soft === this._sqSoft) return;
      if (hard === this._sqHard && chestPerf.lite && this._sqDrew) { this._sqDrew = false; return; }
      this._sqHard = hard; this._sqSoft = soft; this._sqDrew = true;
      return RL0.call(this);
    };
    proto.resize = function () { this._sqHard = null; return RS0.apply(this, arguments); };
  }
  const boot = () => { const CM = window.ChestModels; if (CM && Object.keys(GROUPS).every((g) => CM.groups.includes(g))) post({ type: 'ready' }); else setTimeout(boot, 30); };
  boot();
})();
</script>
</body>
</html>
